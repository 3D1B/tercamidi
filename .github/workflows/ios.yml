name: Build iPhone IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test harmony engine
        run: swift test --package-path Core
      - name: Verify generated project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- OpenHarmony.xcodeproj App/Info.plist
      - name: Build iPhone app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project OpenHarmony.xcodeproj \
            -scheme OpenHarmony \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/package/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/OpenHarmony.app build/package/Payload/
          cd build/package
          /usr/bin/zip -qry ../OpenHarmony-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenHarmony-unsigned-IPA
          path: build/OpenHarmony-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## OpenHarmony for iPhone
          Download **OpenHarmony-unsigned-IPA** under **Artifacts** below.
          Unzip the artifact to obtain `OpenHarmony-unsigned.ipa`.
          The IPA is unsigned. Sign it using your usual sideloading workflow before installation.
          Languages: Deutsch, English, Srpski. Minimum iOS: 16.0.
          No signing certificates or Apple credentials are required by this workflow.
          EOF
