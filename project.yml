name: OpenHarmony
options:
  bundleIdPrefix: org.openharmony
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
packages:
  HarmonyCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  OpenHarmony:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HarmonyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openharmony.ios
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenHarmony
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en, sr]
        NSBluetoothAlwaysUsageDescription: Connect Bluetooth MIDI keyboards.
        NSBluetoothPeripheralUsageDescription: Connect Bluetooth MIDI keyboards.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
schemes:
  OpenHarmony:
    build:
      targets:
        OpenHarmony: all
